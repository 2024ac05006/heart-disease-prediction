apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'heart-disease-api'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['heart-disease-api-service:8080']
